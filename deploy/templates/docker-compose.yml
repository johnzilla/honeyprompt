# HoneyPrompt Docker Compose Template
# Replace {DOMAIN} with your domain (e.g., honeyprompt.example.com)
#
# Usage:
#   1. Copy this file and the Caddyfile template to your server
#   2. Replace all occurrences of {DOMAIN} with your actual domain
#   3. Run: docker compose up -d
#
# Requirements:
#   - Docker Engine 24+ with Compose plugin
#   - Ports 80 and 443 open in your firewall
#   - DNS A record pointing {DOMAIN} to this server's IP

services:
  honeyprompt:
    image: ghcr.io/johnzilla/honeyprompt:latest
    # First start creates /data/honeyprompt.toml for {DOMAIN} and generates the
    # site; later starts reuse it, so nonces and events survive restarts.
    command: ["serve", "/data", "--domain", "{DOMAIN}"]
    volumes:
      - hp-data:/data
    restart: always

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: always

volumes:
  # hp-data: project dir (config, site, nonce map, salt, SQLite)
  # Survives `docker compose pull && docker compose up -d` upgrades
  hp-data:
  caddy-data:
  caddy-config:
