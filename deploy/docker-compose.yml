services:
  honeyprompt:
    image: ghcr.io/johnzilla/honeyprompt:latest
    volumes:
      # Whole project dir: config, generated site, nonce map, salt, events DB.
      # First start copies the image's honeyprompt.toml in and generates the site.
      - hp-data:/landing
    restart: always

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: always

volumes:
  hp-data:
  caddy-data:
  caddy-config:
